name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:0933d60933003cb2d0e4f074ba8a83542fe203803fece22be97795e06ccbdfdc
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mpaas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mpaas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check
          test -s README.md
          test -s .github/CODEOWNERS
          test -s .github/workflows/ci.yml
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check module boundaries
        run: npm run check:boundaries
      - name: Dependency audit
        run: npm run audit
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Apply database migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mpaas_test
        run: npm run db:migrate
      - name: Test PostgreSQL tenant isolation
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mpaas_test
        run: npm run test:integration

  security-baseline:
    name: security-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check for credential patterns
        run: npm run check:secrets
