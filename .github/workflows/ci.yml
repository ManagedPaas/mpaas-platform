name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check
          test -s README.md
          test -s .github/CODEOWNERS
          test -s .github/workflows/ci.yml
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Check module boundaries
        run: npm run check:boundaries
      - name: Test
        run: npm test

  security-baseline:
    name: security-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for common credential patterns
        shell: bash
        run: |
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' -- . ':!README.md'; then
            echo "Potential credential pattern found."
            exit 1
          fi
