name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check
          test -s README.md
          test -s .github/CODEOWNERS
          test -s .github/workflows/ci.yml

  security-baseline:
    name: security-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check for common credential patterns
        shell: bash
        run: |
          if git grep -n -I -E 'AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{20,}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----' -- . ':!README.md'; then
            echo "Potential credential pattern found."
            exit 1
          fi
